; 文件浏览器配置文件
; 修改后需要重启服务器生效

[server]
; 服务器监听地址 (0.0.0.0 表示监听所有网络接口)
host = 0.0.0.0
; 服务器端口
port = 9200

[directory]
; 文件系统根目录
; 如果为空字符串，则禁用文件系统操作功能
; 可以使用绝对路径或相对路径
root = ./public
; root = /var/www/html
; root = 

[ssl]
enabled = true
cert_file = cert.pem
key_file = key.pem

[cors]
; 允许的CORS来源，多个用逗号分隔
; 生产环境请修改为实际的前端地址
;allowed_origins = http://localhost:3000,http://127.0.0.1:3000

[security]
; 最大上传文件大小 (MB)
max_content_length_mb = 1000
; 会话有效期 (小时)
session_lifetime_hours = 24
; 默认速率限制 (格式: "次数 per 时间单位")
rate_limit_default = 200 per day;50 per hour

; 密码策略
[password_policy]
; 最小密码长度
min_length = 8
; 是否需要大写字母
require_uppercase = true
; 是否需要小写字母
require_lowercase = true
; 是否需要数字
require_digits = true
; 是否需要特殊字符
require_special = false

; 文件上传限制
[upload]
; 允许的文件扩展名，多个用逗号分隔
;allowed_extensions = .txt,.pdf,.png,.jpg,.jpeg,.gif,.doc,.docx,.xls,.xlsx,.zip,.rar,.mp3,.mp4

; 审计日志配置
[audit]
; 是否启用审计日志
enabled = true
; 日志保留天数
retention_days = 30

; 登录安全配置
[login]
; 最大失败尝试次数
max_failed_attempts = 5
; 锁定时间 (分钟)
lockout_minutes = 15


[proxy]
enabled = true
allowed_targets = http://localhost:8000,ws://localhost:8765