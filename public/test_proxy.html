<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理服务测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }
        
        .username {
            color: #667eea;
            font-weight: bold;
        }
        
        .logout-btn {
            padding: 6px 12px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .logout-btn:hover {
            background: #d32f2f;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .url-preview {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #666;
            word-break: break-all;
        }
        
        .method-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .method-btn {
            padding: 8px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .method-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        
        .method-btn.get.active { background: #4caf50; border-color: #4caf50; }
        .method-btn.post.active { background: #ff9800; border-color: #ff9800; }
        .method-btn.put.active { background: #2196f3; border-color: #2196f3; }
        .method-btn.delete.active { background: #f44336; border-color: #f44336; }
        
        .headers-editor {
            background: #f9f9f9;
            border-radius: 6px;
            padding: 10px;
        }
        
        .header-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .header-row input:first-child {
            width: 30%;
        }
        
        .header-row input:last-child {
            width: 60%;
        }
        
        .remove-header {
            width: 40px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .add-header {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .response-area {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .response-header {
            background: #2d2d2d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        
        .btn {
            padding: 10px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5a67d8;
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-success {
            background: #4caf50;
            color: white;
        }
        
        .status-error {
            background: #f44336;
            color: white;
        }
        
        .status-warning {
            background: #ff9800;
            color: white;
        }
        
        .info-text {
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }
        
        .target-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .target-tag {
            padding: 4px 12px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .target-tag:hover {
            background: #bbdef5;
        }
        
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .quick-btn {
            padding: 6px 12px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: #e0e0e0;
        }
        
        @media (max-width: 768px) {
            .header-row {
                flex-wrap: wrap;
            }
            
            .header-row input:first-child,
            .header-row input:last-child {
                width: calc(50% - 25px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 代理服务测试工具</h1>
            <div class="user-info">
                <span>👤 当前用户: <span id="username" class="username">加载中...</span></span>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>
        
        <div class="card">
            <h2>📡 请求配置</h2>
            <div class="form-group">
                <label>目标服务地址</label>
                <select id="targetSelect" onchange="updateUrl()">
                    <option value="">选择预设目标</option>
                </select>
                <input type="text" id="targetUrl" placeholder="例如: http://localhost:8000/api/users" style="margin-top: 10px;">
                <div class="info-text">💡 提示: 只允许代理到配置中允许的目标地址</div>
            </div>
            
            <div class="form-group">
                <label>请求方法</label>
                <div class="method-group" id="methodGroup">
                    <button class="method-btn get" data-method="GET">GET</button>
                    <button class="method-btn post" data-method="POST">POST</button>
                    <button class="method-btn put" data-method="PUT">PUT</button>
                    <button class="method-btn delete" data-method="DELETE">DELETE</button>
                    <button class="method-btn" data-method="PATCH">PATCH</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>请求头 (Headers)</label>
                <div id="headersContainer" class="headers-editor">
                    <div class="header-row">
                        <input type="text" placeholder="Header名称" value="Content-Type">
                        <input type="text" placeholder="Header值" value="application/json">
                        <button class="remove-header" onclick="removeHeader(this)">✕</button>
                    </div>
                </div>
                <button class="add-header" onclick="addHeader()">+ 添加请求头</button>
            </div>
            
            <div class="form-group">
                <label>请求体 (Body)</label>
                <textarea id="requestBody" rows="6" placeholder='{"key": "value"}'></textarea>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="formatJson()">格式化JSON</button>
                    <button class="quick-btn" onclick="clearBody()">清空</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>完整代理URL</label>
                <div class="url-preview" id="urlPreview">等待输入...</div>
            </div>
            
            <button class="btn" id="sendBtn" onclick="sendRequest()">发送请求</button>
        </div>
        
        <div class="card">
            <h2>📥 响应结果</h2>
            <div id="responseInfo" style="margin-bottom: 10px;"></div>
            <div id="responseBody" class="response-area">等待请求...</div>
        </div>
    </div>
    
    <script>
        let currentMethod = 'GET';
        let allowedTargets = [];
        
        // 检查登录状态
        async function checkAuth() {
            try {
                const response = await fetch('/api/check-auth', {
                    credentials: 'same-origin'
                });
                const data = await response.json();
                
                if (!data.authenticated) {
                    window.location.href = '/login.html';
                    return;
                }
                
                document.getElementById('username').textContent = data.user?.username || '未知';
                
                // 获取代理状态
                await getProxyStatus();
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login.html';
            }
        }
        
        // 获取代理状态
        async function getProxyStatus() {
            try {
                const response = await fetch('/api/proxy/status', {
                    credentials: 'same-origin'
                });
                const data = await response.json();
                
                if (data.enabled) {
                    allowedTargets = data.allowed_targets || [];
                    populateTargetSelect(allowedTargets);
                    
                    // 如果有允许的目标，设置第一个为默认
                    if (allowedTargets.length > 0 && !document.getElementById('targetUrl').value) {
                        document.getElementById('targetUrl').value = allowedTargets[0];
                        updateUrl();
                    }
                } else {
                    showError('代理功能未启用，请联系管理员');
                    document.getElementById('sendBtn').disabled = true;
                }
            } catch (error) {
                console.error('Get proxy status error:', error);
                showError('无法获取代理状态');
            }
        }
        
        // 填充目标选择器
        function populateTargetSelect(targets) {
            const select = document.getElementById('targetSelect');
            select.innerHTML = '<option value="">选择预设目标</option>';
            
            targets.forEach(target => {
                const option = document.createElement('option');
                option.value = target;
                option.textContent = target;
                select.appendChild(option);
            });
        }
        
        // 更新URL预览
        function updateUrl() {
            const target = document.getElementById('targetUrl').value;
            if (!target) {
                document.getElementById('urlPreview').textContent = '请输入目标地址';
                return;
            }
            
            // 构建代理URL
            let proxyUrl = target;
            if (!proxyUrl.startsWith('http://') && !proxyUrl.startsWith('https://')) {
                proxyUrl = 'http://' + proxyUrl;
            }
            
            // 移除协议前缀用于代理路径
            let proxyPath = proxyUrl.replace(/^https?:\/\//, '');
            const fullProxyUrl = `/proxy/${proxyPath}`;
            
            document.getElementById('urlPreview').innerHTML = `
                <strong>代理地址:</strong> ${fullProxyUrl}<br>
                <strong>目标地址:</strong> ${proxyUrl}
            `;
        }
        
        // 选择目标
        function onTargetSelect() {
            const select = document.getElementById('targetSelect');
            if (select.value) {
                document.getElementById('targetUrl').value = select.value;
                updateUrl();
            }
        }
        
        // 设置请求方法
        function setMethod(method) {
            currentMethod = method;
            document.querySelectorAll('.method-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.method-btn[data-method="${method}"]`).classList.add('active');
        }
        
        // 添加请求头
        function addHeader(key = '', value = '') {
            const container = document.getElementById('headersContainer');
            const headerRow = document.createElement('div');
            headerRow.className = 'header-row';
            headerRow.innerHTML = `
                <input type="text" placeholder="Header名称" value="${escapeHtml(key)}">
                <input type="text" placeholder="Header值" value="${escapeHtml(value)}">
                <button class="remove-header" onclick="removeHeader(this)">✕</button>
            `;
            container.appendChild(headerRow);
        }
        
        // 移除请求头
        function removeHeader(btn) {
            btn.parentElement.remove();
        }
        
        // 获取请求头
        function getHeaders() {
            const headers = {};
            const rows = document.querySelectorAll('#headersContainer .header-row');
            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                const key = inputs[0].value.trim();
                const value = inputs[1].value.trim();
                if (key && value) {
                    headers[key] = value;
                }
            });
            return headers;
        }
        
        // 格式化JSON
        function formatJson() {
            const body = document.getElementById('requestBody').value;
            try {
                const parsed = JSON.parse(body);
                document.getElementById('requestBody').value = JSON.stringify(parsed, null, 2);
            } catch (e) {
                showError('不是有效的JSON格式');
            }
        }
        
        // 清空请求体
        function clearBody() {
            document.getElementById('requestBody').value = '';
        }
        
        // 显示错误
        function showError(msg) {
            const responseInfo = document.getElementById('responseInfo');
            responseInfo.innerHTML = `<span class="status-badge status-error">错误</span> ${msg}`;
            setTimeout(() => {
                if (responseInfo.innerHTML.includes(msg)) {
                    responseInfo.innerHTML = '';
                }
            }, 5000);
        }
        
        // 发送请求
        async function sendRequest() {
            const target = document.getElementById('targetUrl').value.trim();
            if (!target) {
                showError('请输入目标地址');
                return;
            }
            
            // 构建代理URL
            let proxyUrl = target;
            if (!proxyUrl.startsWith('http://') && !proxyUrl.startsWith('https://')) {
                proxyUrl = 'http://' + proxyUrl;
            }
            
            // 验证目标是否在白名单中
            let isAllowed = false;
            for (let allowed of allowedTargets) {
                if (proxyUrl.startsWith(allowed)) {
                    isAllowed = true;
                    break;
                }
            }
            
            if (!isAllowed) {
                showError(`目标地址不在白名单中。允许的目标: ${allowedTargets.join(', ')}`);
                return;
            }
            
            // 构建代理路径
            let proxyPath = proxyUrl.replace(/^https?:\/\//, '');
            const fullUrl = `/proxy/${proxyPath}`;
            
            const headers = getHeaders();
            const body = document.getElementById('requestBody').value;
            const method = currentMethod;
            
            // 显示加载状态
            const sendBtn = document.getElementById('sendBtn');
            const originalText = sendBtn.innerHTML;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"></span> 发送中...';
            
            document.getElementById('responseBody').innerHTML = '<span class="loading"></span> 请求发送中...';
            document.getElementById('responseInfo').innerHTML = '';
            
            try {
                const options = {
                    method: method,
                    headers: headers,
                    credentials: 'same-origin'
                };
                
                if (method !== 'GET' && method !== 'HEAD' && body) {
                    options.body = body;
                }
                
                const response = await fetch(fullUrl, options);
                const responseText = await response.text();
                
                // 显示响应信息
                const statusClass = response.ok ? 'status-success' : 'status-error';
                const statusText = response.status === 200 ? '成功' : 
                                  response.status === 401 ? '未授权' :
                                  response.status === 403 ? '禁止访问' :
                                  response.status === 404 ? '未找到' :
                                  response.status === 500 ? '服务器错误' : '错误';
                
                document.getElementById('responseInfo').innerHTML = `
                    <span class="status-badge ${statusClass}">${response.status} ${statusText}</span>
                    <span style="margin-left: 10px; font-size: 12px; color: #666;">耗时: ${response.headers.get('x-response-time') || '?'}ms</span>
                `;
                
                // 尝试格式化JSON响应
                let displayText = responseText;
                try {
                    const json = JSON.parse(responseText);
                    displayText = JSON.stringify(json, null, 2);
                } catch (e) {
                    // 不是JSON，保持原样
                }
                
                document.getElementById('responseBody').innerHTML = escapeHtml(displayText);
                
                // 如果未授权，跳转到登录页
                if (response.status === 401) {
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                }
                
            } catch (error) {
                console.error('Request error:', error);
                document.getElementById('responseBody').innerHTML = `请求失败: ${error.message}`;
                document.getElementById('responseInfo').innerHTML = '<span class="status-badge status-error">连接失败</span>';
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = originalText;
            }
        }
        
        // 退出登录
        async function logout() {
            try {
                await fetch('/api/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                window.location.href = '/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/login.html';
            }
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 监听目标地址变化
        document.getElementById('targetUrl').addEventListener('input', updateUrl);
        document.getElementById('targetSelect').addEventListener('change', onTargetSelect);
        
        // 初始化方法按钮
        document.querySelectorAll('.method-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setMethod(btn.dataset.method);
            });
        });
        
        // 默认激活GET
        setMethod('GET');
        
        // 页面加载时检查登录状态
        checkAuth();
    </script>
</body>
</html>
